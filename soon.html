<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Раздел в разработке — Радио ВОС</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/main.css">
  <script>
    try {
      var s = JSON.parse(localStorage.getItem("vos-a11y") || "{}"), r = document.documentElement;
      if (s.theme) r.dataset.theme = s.theme;
      if (s.on) {
        if (s.scheme) r.dataset.scheme = s.scheme;
        if (s.font) r.dataset.font = s.font;
        r.style.setProperty("--scale", s.scale || 1.25);
        if (s.tracking) r.style.setProperty("--tracking", s.tracking);
        if (s.leading) r.style.setProperty("--leading", s.leading);
      }
    } catch (e) {}
  </script>
</head>
<body>
  <main class="section" id="main">
    <div class="container">
      <p><a href="./">← На главную</a></p>
      <h1 id="title">Раздел в разработке</h1>
      <p class="about__lead" style="margin-top:16px">В прототипе пока готова только главная страница: эфир, программа на сегодня и анонсы. Остальные разделы появятся на следующем шаге.</p>
      <a class="btn btn--accent" href="./#live">Слушать эфир</a>
    </div>
  </main>
  <script>
    var r = new URLSearchParams(location.search).get("r");
    if (r) {
      document.getElementById("title").textContent = "«" + r + "» — раздел в разработке";
      document.title = r + " — Радио ВОС";
    }
  </script>
</body>
</html>
